[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

# Netlify Blobs — admin accounts, sessions, resets and orders are stored here.
# Required for sites created before Blobs was enabled by default.
[[blobs]]
  provider = "netlify"

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/api/:splat"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
